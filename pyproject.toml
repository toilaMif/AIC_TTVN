[project]
name = "aic-ttvn"
version = "0.1.0"
description = "Interactive multimodal video retrieval for AIC"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "minio>=7.2,<8",
  "numpy>=2.0,<3",
  "open-clip-torch>=2.32,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<20",
  "torch>=2.5,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymilvus>=2.5,<2.6",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2025.7.21",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps",
  "retrieval",
]

[tool.ruff]
line-length = 100
target-version = "py311"
